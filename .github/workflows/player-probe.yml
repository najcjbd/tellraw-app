# 玩家实体 NBT 采样（player 不能 summon，需 bot 进服后 data get）
name: Player NBT probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { v: '1.16.5',  java: '11' }
          - { v: '1.17.1',  java: '17' }
          - { v: '1.18.2',  java: '17' }
          - { v: '1.19.4',  java: '17' }
          - { v: '1.20.1',  java: '17' }
          - { v: '1.20.4',  java: '17' }
          - { v: '1.20.5',  java: '21' }
          - { v: '1.21.1',  java: '21' }
          - { v: '1.21.4',  java: '21' }
          - { v: '1.21.5',  java: '21' }
          - { v: '1.21.8',  java: '21' }
          - { v: '1.21.11', java: '21' }
          - { v: '26.2',    java: '25' }
          - { v: '26.3',    java: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mineflayer
        working-directory: tools/mctest
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund mineflayer@4.37.1
      - name: Download server jar
        working-directory: tools/mctest
        run: python3 download_servers.py ${{ matrix.v }}
      - name: Probe player NBT
        working-directory: tools/mctest
        env:
          MF_PATH: ${{ github.workspace }}/tools/mctest/node_modules/mineflayer
        run: python3 probe_player.py ${{ matrix.v }} --java "$JAVA_HOME/bin/java"
      - uses: actions/upload-artifact@v4
        with:
          name: player-${{ matrix.v }}
          path: |
            tools/mctest/work/player-${{ matrix.v }}/player.json
            tools/mctest/work/player-${{ matrix.v }}/console.log
