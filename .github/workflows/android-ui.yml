name: Android UI Smoke

on:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true

      - name: Run Compose UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.tellraw.app/.MainActivity
            sleep 4
            adb exec-out screencap -p > 00-main.png
            adb shell input tap 840 184
            sleep 2
            adb exec-out screencap -p > 01-settings.png
            adb shell input keyevent 4
            adb shell input tap 240 870
            sleep 2
            adb exec-out screencap -p > 02-tellraw-preview.png
            adb shell input keyevent 4
            adb shell input tap 700 870
            sleep 2
            adb exec-out screencap -p > 03-simple-translate-table.png
            adb shell input keyevent 4
            adb shell am start -n com.tellraw.app/.MainActivity
            sleep 3
            adb shell input tap 597 184
            sleep 3
            adb exec-out screencap -p > 04-grid.png

      - name: Upload UI results and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ github.run_id }}
          path: |
            *.png
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
